name: CI

# Frontend test harness - see price-compare's README ("Frontend" in Next
# steps / "The frontend test suite" in Findings) for the full design.
# Layer A (node --test, pure render/legal-lang functions) + Layer B
# (Playwright smoke tests against the real, already-built index.html/
# legal.html, with data/*.json intercepted and served from synthetic
# fixtures) on every push to main and every PR into it - mirroring the
# shape of price-compare's own CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Layer A - pure unit tests
        run: npm run test:unit

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Layer B - Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Same pinned-download approach as price-compare's own actionlint job -
      # see that repo's ci.yml for the rationale.
      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml
